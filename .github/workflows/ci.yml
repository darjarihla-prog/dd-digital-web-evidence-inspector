name: Node 24 verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DR_BROWSER_PATH: /usr/bin/google-chrome
      DR_TEST_LOCALHOST_ONLY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-11-06
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified 2026-11-06
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Verify required browser and PDF text extractor
        run: |
          test -x "$DR_BROWSER_PATH"
          "$DR_BROWSER_PATH" --version
          command -v pdftotext
      - name: Run unit and required sandboxed browser tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          set-safe-directory: false
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks 8.30.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan committed history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'
